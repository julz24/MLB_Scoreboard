# Compile le firmware et publie une release GitHub a chaque etiquette "vX.Y.Z".
# Les tableaux deja installes voient la nouvelle version dans leur web UI
# (Parametres > Systeme) et l'installent sur le bouton "Installer".
#
# Publier une version :
#   1. augmenter FW_VERSION dans version.h (ex. "1.2.0") et commiter
#   2. git tag -a v1.2.0 -m "Nouveautes de la version, une par ligne"
#      git push origin main v1.2.0
# Le message de l'etiquette devient le texte de la release : c'est lui que le
# tableau affiche dans la fenetre "Nouveautes" de la web UI.
name: Release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # creer la release et y attacher les .bin

env:
  # Memes reglages de carte que dans l'IDE Arduino (ESP32S3 Dev Module).
  FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=min_spiffs,CDCOnBoot=cdc
  ESP32_CORE: "3.3.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MLB_Scoreboard          # arduino-cli exige que le dossier porte le nom du .ino principal

      - name: Verifier que l'etiquette correspond a version.h
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^#define FW_VERSION *"\(.*\)".*/\1/p' MLB_Scoreboard/version.h)
          echo "etiquette=$tag version.h=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::L'etiquette v$tag ne correspond pas a FW_VERSION \"$ver\" dans version.h"
            exit 1
          fi

      - name: Texte de la release (message de l'etiquette annotee)
        working-directory: MLB_Scoreboard
        run: |
          # actions/checkout ne recupere pas l'objet de l'etiquette annotee : on le
          # telecharge, puis on garde seulement son message (pas l'auteur ni la date).
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" > ../notes.md
          cat ../notes.md

      - uses: arduino/setup-arduino-cli@v2

      - name: Installer le core ESP32 et les bibliotheques (versions figees)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "ElegantOTA@4.0.0"
          arduino-cli lib install "Adafruit GFX Library@1.13.0"
          arduino-cli lib install "Adafruit BusIO@1.17.4"
          arduino-cli lib install "ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.14"

      - name: Compiler
        run: arduino-cli compile --fqbn "$FQBN" --build-path build --warnings none MLB_Scoreboard

      - name: Preparer les fichiers de la release
        run: |
          mkdir out
          # Mise a jour par la web UI (et par ElegantOTA /update)
          cp build/MLB_Scoreboard.ino.bin out/scoreboard.bin
          # Premiere installation par USB d'un tableau neuf (bootloader + partitions + firmware, a l'adresse 0x0)
          cp build/MLB_Scoreboard.ino.merged.bin out/scoreboard-usb-complet.bin
          ls -l out

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/scoreboard.bin
            out/scoreboard-usb-complet.bin
          body_path: notes.md            # message de l'etiquette (pas de notes generees : elles contiennent des liens)
